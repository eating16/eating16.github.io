<svg xmlns="http://www.w3.org/2000/svg" width="640" height="508" viewBox="0 0 640 508" role="img" aria-label="图片加载中">
  <title>图片加载中</title>
  <style>
    .runner {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: run-bob .42s ease-in-out infinite;
    }
    .progress {
      transform-box: fill-box;
      transform-origin: left center;
      animation: loading-progress 1.8s ease-in-out infinite both;
    }
    .middle { animation-delay: .2s; }
    .bottom { animation-delay: .4s; }
    @keyframes run-bob {
      0%, 100% { transform: translate(0, 0) rotate(-3deg); }
      25% { transform: translate(4px, -6px) rotate(2deg); }
      50% { transform: translate(8px, 0) rotate(-3deg); }
      75% { transform: translate(4px, -6px) rotate(2deg); }
    }
    @keyframes loading-progress {
      0%, 12% { transform: scaleX(.06); }
      70%, 88% { transform: scaleX(1); }
      100% { transform: scaleX(.06); }
    }
    @media (prefers-reduced-motion: reduce) {
      .runner, .progress { animation: none; }
    }
  </style>
  <g class="runner">
    <image href="data:image/webp;base64," x="116" y="155" width="201" height="201"/>
  </g>
  <g fill="#81748b" opacity=".23">
    <rect x="276" y="212" width="210" height="8" rx="4"/>
    <rect x="276" y="246" width="210" height="8" rx="4"/>
    <rect x="276" y="280" width="210" height="8" rx="4"/>
  </g>
  <g fill="#ce7cae" opacity=".8">
    <rect class="progress" x="276" y="212" width="210" height="8" rx="4"/>
    <rect class="progress middle" x="276" y="246" width="210" height="8" rx="4"/>
    <rect class="progress bottom" x="276" y="280" width="210" height="8" rx="4"/>
  </g>
</svg>
